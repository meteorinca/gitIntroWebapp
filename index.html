<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Git Intro Webapp</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="assets/css/styles.css" />
  <!-- Include marked.js for Markdown parsing -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>
  <main class="article-page">

    <article class="git-article">
      <p class="eyebrow">EZPZ Git</p>

      <!-- Container for the injected markdown -->
      <div id="markdown-content" class="markdown-body">
        <p>Loading content...</p>
      </div>

      <div class="slideshow-trigger-container" style="text-align: center; margin-top: 40px;">
        <button id="showSlideshowBtn" class="show-commands-btn" type="button">View Screenshots</button>
      </div>
    </article>

    <section class="bottom-command-gate">
      <p class="tiny-note">Need the actual commands?</p>
      <button id="showCommandsBtn" class="show-commands-btn" type="button">
        Open Git Command Search
      </button>
    </section>

    <section id="gitCommandsPanel" class="commands-panel" hidden>
      <header class="app-header">
        <h2>Git Command Search</h2>
        <p class="tagline">Fast lookup for common Git commands</p>

        <div class="search-wrapper">
          <input id="searchInput" type="search" placeholder="Search commands or descriptions..."
            aria-label="Search commands" />
        </div>
      </header>

      <main id="commandContainer" class="command-container" aria-live="polite"></main>
    </section>

  </main>

  <template id="categoryTemplate">
    <section class="category">
      <h2 class="category-title"></h2>
      <div class="commands"></div>
    </section>
  </template>

  <template id="commandTemplate">
    <article class="command-card">
      <div class="command-header">
        <h3 class="command-name"></h3>
        <button class="copy-btn" type="button" aria-label="Copy command">Copy</button>
      </div>
      <code class="command-text"></code>
      <p class="command-description"></p>
    </article>
  </template>

  <script>
    const showCommandsBtn = document.getElementById("showCommandsBtn");
    const gitCommandsPanel = document.getElementById("gitCommandsPanel");

    showCommandsBtn.addEventListener("click", () => {
      const isHidden = gitCommandsPanel.hasAttribute("hidden");

      if (isHidden) {
        gitCommandsPanel.removeAttribute("hidden");
        showCommandsBtn.textContent = "Hide Git Command Search";
        gitCommandsPanel.scrollIntoView({ behavior: "smooth", block: "start" });
      } else {
        gitCommandsPanel.setAttribute("hidden", "");
        showCommandsBtn.textContent = "Open Git Command Search";
      }
    });
  </script>
  <!-- Slideshow Modal -->
  <div id="slideshowModal" class="slideshow-modal" hidden>
    <button id="closeSlideshowBtn" class="slideshow-close" aria-label="Close Slideshow">&times;</button>
    <button id="prevSlideBtn" class="slideshow-nav prev" aria-label="Previous Slide">&#10094;</button>
    <div class="slideshow-content">
      <img id="slideshowImg" src="" alt="Slideshow Image" />
      <div id="slideshowCaption" class="slideshow-caption"></div>
    </div>
    <button id="nextSlideBtn" class="slideshow-nav next" aria-label="Next Slide">&#10095;</button>
  </div>
</body>

  <script src="assets/js/app.js" type="module"></script>
  <script>
    // Fetch and render the Markdown file
    fetch('introtoGit.md')
      .then(response => {
        if (!response.ok) {
          throw new Error('Network response was not ok');
        }
        return response.text();
      })
      .then(markdown => {
        document.getElementById('markdown-content').innerHTML = marked.parse(markdown);
      })
      .catch(error => {
        console.error('Error fetching markdown:', error);
        document.getElementById('markdown-content').innerHTML = '<p>Error loading guide. Please try again later.</p>';
      });

    // Slideshow Logic
    const slideshowImages = [
      { src: 'assets/img/vscode-source-control.png', caption: 'VS Code Source Control Tab' },
      { src: 'assets/img/vscode-commit-message.png', caption: 'Writing a Commit Message' },
      { src: 'assets/img/vscode-commit-message2.png', caption: 'Commit Message Example' },
      { src: 'assets/img/vscode-commit-message3.png', caption: 'Another Commit Message' },
      { src: 'assets/img/vscode-github-publish.png', caption: 'Publishing to GitHub' },
      { src: 'assets/img/vscode-github-publish2.png', caption: 'GitHub Publish Options' }
    ];

    let currentSlide = 0;
    const slideshowModal = document.getElementById('slideshowModal');
    const slideshowImg = document.getElementById('slideshowImg');
    const slideshowCaption = document.getElementById('slideshowCaption');

    document.getElementById('showSlideshowBtn').addEventListener('click', () => {
      currentSlide = 0;
      updateSlide();
      slideshowModal.removeAttribute('hidden');
    });

    document.getElementById('closeSlideshowBtn').addEventListener('click', () => {
      slideshowModal.setAttribute('hidden', '');
    });

    document.getElementById('prevSlideBtn').addEventListener('click', () => {
      currentSlide = (currentSlide - 1 + slideshowImages.length) % slideshowImages.length;
      updateSlide();
    });

    document.getElementById('nextSlideBtn').addEventListener('click', () => {
      currentSlide = (currentSlide + 1) % slideshowImages.length;
      updateSlide();
    });

    function updateSlide() {
      slideshowImg.src = slideshowImages[currentSlide].src;
      slideshowCaption.textContent = slideshowImages[currentSlide].caption;
    }
  </script>
</body>
</html>
